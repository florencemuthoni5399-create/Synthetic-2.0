# Render Blueprint - SynthTrade Pro is a static single-page app (React + Vite).
# Everything runs in the browser; there is no server to host.
services:
  - type: web
    runtime: static
    name: synthtrade-pro
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
